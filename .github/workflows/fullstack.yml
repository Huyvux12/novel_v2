name: Full-stack tests
on:
  push:
    branches: [main, feature/fullstack-reader-v3]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q tests/test_backend.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check js/v3.js
      - run: node --check js/admin.js
      - run: node --check js/app.js
      - run: node --check js/reader.js
