<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị nội dung · Novel Atelier</title><link rel="stylesheet" href="/css/v3.css"><script src="/js/admin.js" defer></script></head><body><header class="topbar"><div class="top-inner"><a href="/v3.html" class="brand">✦ Novel Atelier</a><nav class="desktop-nav"><a href="/v3.html">← Về website</a></nav><span class="muted">Content Studio</span></div></header><main class="page"><div class="section-head"><h1>Quản lý thư viện</h1><span class="eyebrow">ADMIN DASHBOARD</span></div><div id="adminFeedback" role="status" aria-live="polite" class="muted">Đang kiểm tra quyền…</div><section id="studio" class="hidden"><div class="admin-panel"><h2>Thêm hoặc cập nhật truyện</h2><form id="bookForm"><div class="admin-grid"><label>Slug (không dấu)<input name="id" pattern="[a-z0-9]+(-[a-z0-9]+)*" required placeholder="ten-truyen"></label><label>Tên truyện<input name="title" required></label><label>Tác giả<input name="author" required></label><label>URL bìa HTTPS<input name="cover" type="url" placeholder="https://..."></label><label>Thể loại (phân cách dấu phẩy)<input name="genres" placeholder="Fantasy, Romance"></label><label>Trạng thái<input name="status" value="Đang tiến hành"></label></div><label>Giới thiệu<textarea name="description"></textarea></label><button type="submit" class="primary-btn">Lưu truyện</button><button id="resetBook" class="outline-btn" type="button">Tạo mới</button></form></div><div class="admin-panel"><h2>Biên tập chương</h2><form id="chapterForm"><div class="admin-grid"><label>Truyện<select name="book_id" id="bookSelect" class="filter-select" required></select></label><label>Số chương<input type="number" name="number" min="1" required value="1"></label></div><label>Tiêu đề chương<input name="title" required></label><label>Nội dung Markdown<textarea name="markdown" required rows="14" placeholder="# Chương 1..."></textarea></label><div class="reader-nav"><button class="primary-btn" type="submit">Lưu chương</button><button class="outline-btn" type="button" id="deleteChapter">Xóa chương</button></div></form></div><div class="admin-panel"><h2>Danh sách truyện</h2><div id="bookRows" class="chapter-list"></div></div></section></main></body></html>
