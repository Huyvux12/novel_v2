services:
  - type: web
    name: novel-v3
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/novel.db
    disk:
      name: novel-data
      mountPath: /var/data
      sizeGB: 1
